<style>
/* Layout: Apple-style — full-width alternating bands (white / warm grey), centered column, translucent sticky nav, big quiet type. */
:root{
  --bg:#ffffff; --band:#f5f5f7; --card:#ffffff;
  --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b;
  --line:rgba(0,0,0,.08); --accent:#0071e3; --accent-fg:#ffffff;
  --tag:#e8f0fe; --tag-fg:#0058b0;
  --nav:rgba(255,255,255,.72);
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --band:#161617; --card:#1d1d1f;
  --fg:#f5f5f7; --fg2:#a1a1a6; --fg3:#86868b;
  --line:rgba(255,255,255,.12); --accent:#2997ff; --accent-fg:#000000;
  --tag:#0f2a4a; --tag-fg:#7fbcff;
  --nav:rgba(0,0,0,.72); --shadow:0 2px 12px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --band:#161617; --card:#1d1d1f;
  --fg:#f5f5f7; --fg2:#a1a1a6; --fg3:#86868b;
  --line:rgba(255,255,255,.12); --accent:#2997ff; --accent-fg:#000000;
  --tag:#0f2a4a; --tag-fg:#7fbcff;
  --nav:rgba(0,0,0,.72); --shadow:0 2px 12px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.012em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.025em}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--band)}
section{padding-block:72px}
@media (max-width:600px){section{padding-block:48px}}

/* Nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;height:56px;gap:20px}
.brand{font-weight:600;font-size:15px;color:var(--fg);letter-spacing:-.01em;white-space:nowrap}
.brand:hover{text-decoration:none}
.navlinks{display:flex;gap:22px;font-size:13px;justify-self:end}
.navlinks a{color:var(--fg);opacity:.8;white-space:nowrap}
.navlinks a:hover{opacity:1;text-decoration:none}
@media (max-width:760px){
  .nav .wrap{grid-template-columns:1fr auto;height:auto;row-gap:0;padding-block:10px 8px}
  .chips{grid-column:1 / -1;margin-top:8px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
}

/* Day chips in the nav */
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;justify-content:center;min-width:0}
.chips::-webkit-scrollbar{display:none}
@media (max-width:1000px){.chips{justify-content:flex-start}}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;min-width:58px;padding:5px 10px;border-radius:10px;color:var(--fg);line-height:1.2}
.chip b{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.chip small{color:var(--fg2);font-size:10px}
.chip:hover{background:var(--band);text-decoration:none}
.chip.active{background:var(--fg);color:var(--bg)}
.chip.active small{color:var(--bg);opacity:.7}

/* Day sections */
.day{scroll-margin-top:calc(57px + env(safe-area-inset-top,0px));--g1:#0a84ff;--g2:#5ac8fa}
@media (max-width:760px){.day{scroll-margin-top:calc(96px + env(safe-area-inset-top,0px))}}
.day.seoul{--g1:#bf5af2;--g2:#ff6482}
.day .wrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:40px 64px;align-items:start}
@media (max-width:760px){.day .wrap{grid-template-columns:1fr;gap:28px}}
.dayhead{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
@media (max-width:760px){.dayhead{position:static}}
.dayhead .top{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.wx{display:flex;align-items:center;gap:10px;padding-bottom:10px;min-height:48px}
.wx .wxi{width:44px;height:44px;display:grid;place-items:center;color:var(--fg)}
.wx .wxi svg{width:40px;height:40px}
.wx .wxt{display:flex;flex-direction:column;line-height:1.25}
.wx .wxt b{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wx .wxt span{font-size:12px;color:var(--fg2)}
.wx.none .wxi{color:var(--fg3)}
.dayhead .big{font-size:clamp(72px,10vw,112px);font-weight:700;line-height:.9;letter-spacing:-.05em;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.dayhead .num{font-size:13px;font-weight:600;color:var(--fg2);letter-spacing:.04em;text-transform:uppercase}
.dayhead h2{font-size:clamp(26px,3.4vw,34px);font-weight:700;line-height:1.15;margin-top:6px}
.dayhead .date{font-size:15px;color:var(--fg2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dayhead .stay{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fg2);margin-top:6px}
.dayhead .stay svg{width:16px;height:16px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:980px;background:var(--tag);color:var(--tag-fg)}
.pill.today{background:var(--accent);color:var(--accent-fg)}

.timeline{list-style:none;margin:0;padding:0;min-width:0}
.timeline li{display:grid;grid-template-columns:52px 40px 1fr;gap:0 12px;position:relative}
.timeline li::before{content:"";position:absolute;left:calc(52px + 12px + 19px);top:0;bottom:0;width:2px;background:var(--line)}
.timeline li:first-child::before{top:22px}
.timeline li:last-child::before{bottom:auto;height:22px}
.timeline .t{font-variant-numeric:tabular-nums;font-size:14px;color:var(--fg2);font-weight:600;white-space:nowrap;padding-top:9px;line-height:1.3}
.timeline .t span{display:block;color:var(--fg3);font-size:12px;font-weight:500}
.timeline .ic{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--fg)}
.timeline .ic svg{width:18px;height:18px}
.timeline li.quiet .ic{width:12px;height:12px;margin:14px;border:2px solid var(--fg3);box-shadow:none;background:var(--bg)}
.timeline li.quiet .ic svg{display:none}
.timeline .what{min-width:0;padding:8px 0 28px;font-size:19px;font-weight:500;line-height:1.35;letter-spacing:-.02em}
.timeline li:last-child .what{padding-bottom:0}
.timeline .what .note{display:block;font-size:14px;color:var(--fg2);font-weight:400;margin-top:4px;letter-spacing:-.01em}
.timeline .what .links{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13px;font-weight:500}
.timeline .what .links a::after{content:" ›"}
.timeline li.quiet .what{color:var(--fg2);font-weight:400;font-size:16px}
.timeline li.ticketrow .what{padding-top:0}

.ticket{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;border-radius:20px;padding:22px 24px;margin-top:2px;max-width:520px;color:#f5f5f7;background:linear-gradient(135deg,#1c1c1e 0%,#2c2c2e 60%,#3a3a3c 100%);box-shadow:0 10px 30px rgba(0,0,0,.18);position:relative;overflow:hidden}
.ticket::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--g1),transparent 70%);opacity:.5}
.ticket>*{position:relative;z-index:1}
.ticket .code{font-size:11px;color:rgba(245,245,247,.6);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.ticket .port{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.ticket .time{font-size:14px;color:rgba(245,245,247,.75);font-variant-numeric:tabular-nums;margin-top:4px}
.ticket .mid{display:flex;flex-direction:column;align-items:center;gap:6px;color:rgba(245,245,247,.6);font-size:12px;min-width:80px}
.ticket .mid svg{width:20px;height:20px;color:#f5f5f7}
.ticket .mid .line{width:80px;height:1px;background:rgba(245,245,247,.35);position:relative}
.ticket .mid .line::after{content:"";position:absolute;right:-1px;top:-3px;width:7px;height:7px;border-right:1px solid rgba(245,245,247,.7);border-top:1px solid rgba(245,245,247,.7);transform:rotate(45deg)}
.ticket .to{text-align:right}
@media (max-width:420px){.ticket{padding:16px 18px;gap:10px}.ticket .port{font-size:24px}.ticket .mid .line{width:44px}.ticket .mid{min-width:44px}}

.sechead{text-align:center;margin-bottom:40px}
.sechead h2{font-size:clamp(32px,5vw,48px);font-weight:700}
.sechead p{color:var(--fg2);font-size:19px;margin:10px auto 0;max-width:36em}
.seg{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
.seg button{font:inherit;font-size:14px;font-weight:500;padding:8px 16px;border-radius:980px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;letter-spacing:-.01em}
.seg button:hover{background:var(--bg)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border-radius:18px;padding:22px 22px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card .area{font-size:12px;font-weight:600;color:var(--fg2);letter-spacing:.02em}
.card .pick{font-size:11px;font-weight:600;padding:3px 9px;border-radius:980px;background:var(--tag);color:var(--tag-fg);white-space:nowrap}
.card h3{font-size:20px;font-weight:600;line-height:1.25;letter-spacing:-.02em}
.card h3 a{color:var(--fg)}
.card h3 small{display:block;font-size:14px;color:var(--fg2);font-weight:400;margin-top:2px}
.card .row{display:grid;grid-template-columns:44px 1fr;gap:10px;font-size:14px;color:var(--fg2);line-height:1.45}
.card .row .k{color:var(--fg3);font-size:12px;font-weight:600;letter-spacing:.02em;padding-top:2px}
.card .row .v{min-width:0;overflow-wrap:anywhere}
.card .tips{margin:0;padding:0;list-style:none;font-size:14px;color:var(--fg2);display:flex;flex-direction:column;gap:5px;line-height:1.45}
.card .tips li{padding-left:14px;position:relative}
.card .tips li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--fg3)}
.card .actions{display:flex;gap:16px;margin-top:auto;padding-top:8px;font-size:14px;font-weight:500}
.card .actions a::after{content:" ›"}

#seoul-food{padding-bottom:96px}
</style>
</head>

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gmap=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const nmap=q=>'https://map.naver.com/p/search/'+encodeURIComponent(q);
const ncoord=(lat,lng)=>`https://map.naver.com/p?c=${lng},${lat},17,0,0,0,dh`;
const hasKo=s=>/[가-힣]/.test(s||'');
const lnk=(href,label)=>`<a href="${href}" target="_blank" rel="noopener">${label}</a>`;
const todayKey=(()=>{const n=new Date();return (n.getMonth()+1).toString().padStart(2,'0')+'.'+n.getDate().toString().padStart(2,'0')+'|'+n.getFullYear()})();

/* Days */
const chips=document.getElementById('chips'),daysEl=document.getElementById('days');
DAYS.forEach((d,i)=>{
  const id='day'+(i+1), isToday=todayKey===d.d+'|2026';
  chips.insertAdjacentHTML('beforeend',`<a class="chip" href="#${id}" data-for="${id}"><b>${d.d}</b><small>週${d.w}</small></a>`);
  const items=d.items.map(it=>{
    if(it.ticket){const k=it.ticket;return `<li class="ticketrow"><div class="t">${k.dep}<span>→ ${k.arr}</span></div><div class="ic">${I[k.icon]}</div><div class="what"><div class="ticket"><div><div class="code">${esc(k.code)}</div><div class="port">${esc(k.from)}</div><div class="time">${k.dep} 出發</div></div><div class="mid">${I[k.icon]}<div class="line"></div><span>${k.dur}</span></div><div class="to"><div class="code">${esc(k.label)}</div><div class="port">${esc(k.to)}</div><div class="time">${k.arr} 抵達</div></div></div></div></li>`}
    const t=it.t2?`<div class="t">${it.t}<span>– ${it.t2}</span></div>`:`<div class="t">${it.t}</div>`;
    const L=[];if(it.q||it.google)L.push(lnk(it.google||gmap(it.q),'Google 地圖'));if(it.q||it.naver)L.push(lnk(it.naver||nmap(it.q),'Naver 地圖'));if(it.link)L.push(lnk(it.link,'介紹'));
    return `<li${it.quiet?' class="quiet"':''}>${t}<div class="ic">${it.k?I[it.k]:''}</div><div class="what">${esc(it.w)}${it.note?`<span class="note">${esc(it.note)}</span>`:''}${L.length?`<span class="links">${L.join('')}</span>`:''}</div></li>`;
  }).join('');
  const stay=d.stay?`<div class="stay">${I.hotel}<span>住 ${esc(d.stay)}</span></div>`:'';
  daysEl.insertAdjacentHTML('beforeend',`<section class="day${i%2?' band':''}${d.city==='首爾'?' seoul':''}" id="${id}"><div class="wrap"><div class="dayhead"><div class="top"><div class="big">${String(i+1).padStart(2,'0')}</div><div class="wx" data-city="${d.city}" data-date="2026-${d.d.replace('.','-')}"><div class="wxi">${I.wxload}</div><div class="wxt"><b>天氣</b><span>載入中…</span></div></div></div><div class="num">Day ${i+1} · ${d.city}</div><h2>${esc(d.title)}</h2><div class="date">2026.${d.d} 週${d.w}${isToday?'<span class="pill today">今天</span>':''}</div>${stay}</div><ul class="timeline">${items}</ul></div></section>`);
});

/* Active chip on scroll */
const chipEls=[...chips.children], secs=[...daysEl.children];
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){chipEls.forEach(c=>c.classList.toggle('active',c.dataset.for===e.target.id));const a=chips.querySelector('.active');if(a)a.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}})},{rootMargin:'-45% 0px -50% 0px'});
secs.forEach(s=>io.observe(s));
chipEls[0].classList.add('active');

/* Busan restaurants */
const areas=['全部',...new Set(BUSAN.map(r=>r.area))];
const seg=document.getElementById('areaSeg'),grid=document.getElementById('busanGrid');
let cur='全部';try{cur=localStorage.getItem('area')||'全部'}catch(e){}
if(!areas.includes(cur))cur='全部';
function card(r){
  const title=r.info?`<a href="${r.info}" target="_blank" rel="noopener">${esc(r.name)}</a>`:esc(r.name);
  const q=(hasKo(r.kr)?r.kr:r.name)+' 부산';
  return `<article class="card"><div class="top"><span class="area">${esc(r.area)}</span></div><h3>${title}${r.kr?`<small>${esc(r.kr)}</small>`:''}</h3><div class="row"><span class="k">營業</span><span class="v">${esc(r.hours)}</span></div>${r.addr?`<div class="row"><span class="k">地址</span><span class="v">${esc(r.addr)}</span></div>`:''}${r.tips.length?`<ul class="tips">${r.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}<div class="actions">${lnk(gmap(q),'Google 地圖')}${lnk(r.map||nmap(q),'Naver 地圖')}${r.info?lnk(r.info,'介紹'):''}</div></article>`;
}
function render(){
  seg.innerHTML=areas.map(a=>`<button type="button" id="seg-${a}" aria-pressed="${a===cur}" data-a="${a}">${a}</button>`).join('');
  grid.innerHTML=BUSAN.filter(r=>cur==='全部'||r.area===cur).map(card).join('');
}
seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.a;try{localStorage.setItem('area',cur)}catch(x){}render()});
render();

/* Weather — Open-Meteo, 16-day forecast; days outside the window show as unavailable */
(async()=>{
  const els=[...document.querySelectorAll('.wx')];
  const WMO=c=>c===0?['sun','晴']:c<=2?['psun','多雲時晴']:c===3?['cloud','陰']:c<=48?['fog','霧']:c<=57?['rain','毛毛雨']:c<=67?['rain','雨']:c<=77?['snow','雪']:c<=82?['rain','陣雨']:c<=86?['snow','陣雪']:['storm','雷雨'];
  const fail=(msg)=>els.forEach(e=>{e.classList.add('none');e.querySelector('.wxi').innerHTML=I.cloud;e.querySelector('.wxt').innerHTML=`<b>—</b><span>${msg}</span>`});
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude=35.1796,37.5665&longitude=129.0756,126.978&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=16';
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),10000);
    const r=await fetch(u,{signal:ctl.signal});if(!r.ok)throw 0;
    const j=await r.json();const arr=Array.isArray(j)?j:[j];const by={'釜山':arr[0].daily,'首爾':(arr[1]||arr[0]).daily};
    els.forEach(e=>{
      const d=by[e.dataset.city],ix=d.time.indexOf(e.dataset.date);
      if(ix<0){e.classList.add('none');e.querySelector('.wxi').innerHTML=I.cloud;e.querySelector('.wxt').innerHTML='<b>—</b><span>預報尚未開放（出發前 16 天內）</span>';return}
      const [ic,label]=WMO(d.weather_code[ix]),hi=Math.round(d.temperature_2m_max[ix]),lo=Math.round(d.temperature_2m_min[ix]),pp=d.precipitation_probability_max[ix];
      e.querySelector('.wxi').innerHTML=I[ic];
      e.querySelector('.wxt').innerHTML=`<b>${hi}° <span style="color:var(--fg3);font-weight:500">/ ${lo}°</span></b><span>${e.dataset.city} · ${label}${pp!=null?` · 降雨 ${pp}%`:''}</span>`;
    });
  }catch(err){fail('目前無法取得天氣預報')}
})();
</script>
